name: Update jobs

on:
  schedule:
    - cron: "17 6 * * *" # once a day, 06:17 UTC (Remotive asks for at most 4 calls a day)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fetch_jobs.py", "test_fetch_jobs.py"]

# Least privilege: nothing by default; only the job that commits gets write.
permissions: {}

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test
        run: python3 -m unittest -v
      - name: Fetch jobs
        run: python3 fetch_jobs.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || git commit -m "Update jobs"
          git push
